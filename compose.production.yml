name: comunora

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-build: &app-build
  context: .
  dockerfile: Dockerfile
  args:
    NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.comunora.com.br}
    NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.comunora.com.br}
    NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://comunora.com.br}
    NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL:-https://docs.comunora.com.br}
    NEXT_PUBLIC_STATUS_URL: ${NEXT_PUBLIC_STATUS_URL:-https://status.comunora.com.br}
    NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-Comunora}
    NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-suporte@comunora.com.br}

services:
  platform-postgres:
    image: pgvector/pgvector:0.8.2-pg18-bookworm
    env_file: ${COMUNORA_ENV_DIR:-/etc/comunora/env}/platform-db.env
    volumes:
      - ${COMUNORA_DATA_DIR:-/srv/comunora/data}/platform-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks: [platform-data]

  platform-redis:
    image: redis:8.2.1-alpine
    env_file: ${COMUNORA_ENV_DIR:-/etc/comunora/env}/platform-redis.env
    environment:
      REDIS_APPENDONLY: ${REDIS_APPENDONLY_OVERRIDE:-yes}
    command: >-
      sh -ec 'exec redis-server --requirepass "$$REDIS_PASSWORD"
      --appendonly "$${REDIS_APPENDONLY:-yes}" --appendfsync everysec
      --save 900 1 --save 300 10 --save 60 10000'
    volumes:
      - ${COMUNORA_DATA_DIR:-/srv/comunora/data}/platform-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks: [platform-data]

  evolution-postgres:
    image: postgres:17.10-trixie
    env_file: ${COMUNORA_ENV_DIR:-/etc/comunora/env}/evolution-db.env
    volumes:
      - ${COMUNORA_DATA_DIR:-/srv/comunora/data}/evolution-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks: [evolution-data]

  evolution-redis:
    image: redis:8.2.1-alpine
    env_file: ${COMUNORA_ENV_DIR:-/etc/comunora/env}/evolution-redis.env
    environment:
      REDIS_APPENDONLY: ${REDIS_APPENDONLY_OVERRIDE:-yes}
    command: >-
      sh -ec 'exec redis-server --requirepass "$$REDIS_PASSWORD"
      --appendonly "$${REDIS_APPENDONLY:-yes}" --appendfsync everysec
      --save 900 1 --save 300 10 --save 60 10000'
    volumes:
      - ${COMUNORA_DATA_DIR:-/srv/comunora/data}/evolution-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks: [evolution-data]

  web:
    build:
      <<: *app-build
      target: web
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks: [application]

  api:
    build:
      <<: *app-build
      target: api
    env_file: ${COMUNORA_ENV_DIR:-/etc/comunora/env}/platform-runtime.env
    depends_on:
      platform-postgres: { condition: service_healthy }
      platform-redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks: [application, platform-data]

  worker:
    build:
      <<: *app-build
      target: worker
    profiles: [active]
    env_file: ${COMUNORA_ENV_DIR:-/etc/comunora/env}/platform-runtime.env
    depends_on:
      platform-postgres: { condition: service_healthy }
      platform-redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 20s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging: *default-logging
    networks: [application, platform-data]

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    profiles: [active]
    env_file: ${COMUNORA_ENV_DIR:-/etc/comunora/env}/evolution.env
    depends_on:
      evolution-postgres: { condition: service_healthy }
      evolution-redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 15
    restart: unless-stopped
    logging: *default-logging
    networks: [edge, evolution-data]

  embratel-relay:
    build:
      <<: *app-build
      target: relay
    profiles: [active]
    env_file: ${COMUNORA_ENV_DIR:-/etc/comunora/env}/relay.env
    depends_on:
      evolution-redis: { condition: service_healthy }
      evolution-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    networks: [edge, evolution-data]

  gateway:
    image: nginx:1.30.4-alpine3.24
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/docker/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      - ${COMUNORA_STATE_DIR:-/srv/comunora/state}:/state:ro
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/gateway-health"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    logging: *default-logging
    networks: [edge, application]

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    env_file: ${COMUNORA_ENV_DIR:-/etc/comunora/env}/cloudflared.env
    command: ["tunnel", "--no-autoupdate", "run"]
    depends_on:
      gateway: { condition: service_healthy }
    restart: unless-stopped
    logging: *default-logging
    networks: [edge]

  migrate:
    build:
      <<: *app-build
      target: migration
    profiles: [ops]
    env_file: ${COMUNORA_ENV_DIR:-/etc/comunora/env}/platform-admin.env
    depends_on:
      platform-postgres: { condition: service_healthy }
    networks: [platform-data]

networks:
  edge:
  application:
  platform-data:
    internal: true
  evolution-data:
    internal: true
