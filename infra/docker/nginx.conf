map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# O gateway nao publica portas; somente o container cloudflared alcanca esta rede.
real_ip_header CF-Connecting-IP;
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;

limit_req_zone $binary_remote_addr zone=relay_limit:10m rate=30r/m;

server {
  listen 8080;
  server_name app.comunora.com.br staging-app.comunora.com.br;

  location = /gateway-health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  error_page 503 /maintenance.html;
  location = /maintenance.html {
    root /usr/share/nginx/html;
    internal;
  }

  location / {
    if (-f /state/maintenance.enabled) { return 503; }
    proxy_pass http://web:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 8080;
  server_name api.comunora.com.br staging-api.comunora.com.br;

  error_page 503 =503 @api_maintenance;
  location @api_maintenance {
    default_type application/json;
    return 503 '{"ok":false,"maintenance":true,"message":"Comunora em manutencao programada."}';
  }

  location / {
    if (-f /state/maintenance.enabled) { return 503; }
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 8080;
  server_name evolution.comunora.com.br staging-evolution.comunora.com.br;
  client_max_body_size 25m;

  location / {
    proxy_pass http://evolution-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 70s;
  }
}

server {
  listen 8080;
  server_name relay.comunora.com.br staging-relay.comunora.com.br;
  client_max_body_size 128k;

  location = /health {
    proxy_pass http://embratel-relay:8788/health;
    proxy_set_header Host $host;
  }

  location / {
    limit_req zone=relay_limit burst=10 nodelay;
    proxy_pass http://embratel-relay:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 8080 default_server;
  server_name _;
  return 404;
}
