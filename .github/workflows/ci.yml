name: CI
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plataforma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d plataforma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm --filter @plataforma/db migrate
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/plataforma_test
      - run: pnpm --filter @plataforma/db provision:runtime-role
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/plataforma_test
          DATABASE_RUNTIME_USER: plataforma_runtime
          DATABASE_RUNTIME_PASSWORD: runtime_test_password_32_chars
      - run: pnpm test
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/plataforma_test
          TEST_DATABASE_URL: postgresql://plataforma_runtime:runtime_test_password_32_chars@localhost:5432/plataforma_test
      - run: pnpm audit --prod
