<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova REC</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
      background: #fff;
      color: #111827;
    }
    .toast {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-top: 4px solid #dc2626;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid #e5e7eb;
      background: #111827;
      color: #fff;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .icon {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: #dc2626;
      flex: 0 0 auto;
    }
    .title-wrap { min-width: 0; }
    .eyebrow {
      font-size: 9px;
      font-weight: 700;
      color: #fecaca;
      text-transform: uppercase;
      letter-spacing: .08em;
      line-height: 1.2;
    }
    .title {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.2;
    }
    .pill {
      font-size: 9px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 999px;
      background: #374151;
      color: #fff;
      white-space: nowrap;
    }
    .pill.fibra { background: #047857; }
    .pill.bsod { background: #b45309; }
    .content {
      flex: 1;
      min-height: 0;
      padding: 7px 10px;
      display: grid;
      gap: 5px;
      align-content: start;
    }
    .field {
      border: 1px solid #dbe3ef;
      border-radius: 6px;
      padding: 5px 8px;
      background: #f8fafc;
    }
    .label {
      display: block;
      margin-bottom: 2px;
      font-size: 9px;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .value {
      display: block;
      font-weight: 800;
      line-height: 1.08;
      word-break: break-word;
    }
    .value.rec {
      color: #b91c1c;
      font-size: 19px;
      letter-spacing: 0;
    }
    .value.cf {
      color: #1d4ed8;
      font-size: 15px;
      letter-spacing: 0;
    }
    .value.client {
      color: #111827;
      font-size: 14px;
      letter-spacing: 0;
    }
    .field.compact {
      background: #fff;
    }
    .footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 6px 10px 8px;
      border-top: 1px solid #e5e7eb;
      background: #f8fafc;
    }
    button {
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-copy { background: #e5e7eb; color: #111827; }
    .btn-close { background: #111827; color: #fff; }
  </style>
</head>
<body>
  <section class="toast" role="alert" aria-live="assertive">
    <div class="header">
      <div class="header-left">
        <div class="icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        </div>
        <div class="title-wrap">
          <div class="eyebrow">Alerta EMBRATEL</div>
          <div class="title" id="alert-title">Nova REC</div>
        </div>
      </div>
      <span class="pill" id="tipo">ALERTA</span>
    </div>
    <div class="content">
      <div class="field compact" id="message-field">
        <span class="label">Aviso</span>
        <span class="value client" id="alert-message">-</span>
      </div>
      <div class="field">
        <span class="label">Numero da REC</span>
        <span class="value rec" id="rec-id">-</span>
      </div>
      <div class="field">
        <span class="label">CF Exec.</span>
        <span class="value cf" id="cf-exec">-</span>
      </div>
      <div class="field compact" id="cliente-field">
        <span class="label">Cliente</span>
        <span class="value client" id="cliente">-</span>
      </div>
    </div>
    <div class="footer">
      <button type="button" class="btn-copy" id="copy">Copiar</button>
      <button type="button" class="btn-close" id="close">Fechar</button>
    </div>
  </section>
  <script src="alert.js"></script>
</body>
</html>
